# 사이트를 만들어 Vercel 로 보낸다.
#
# 순서가 이 워크플로의 전부다. 목록 생성이 **두 번** 돈다.
#
#   생성 → 데모 빌드 → 생성
#   └ 버전            └ demoReady
#
# 앞의 것은 pub.dev 에서 진짜 버전을 받아온다. 커밋된 목록은 릴리스를 모르므로
# 그것을 읽으면 무엇을 다시 만들지 판단할 수 없다. 뒤의 것은 demoReady 를
# 러너의 파일시스템으로 맞춘다 — 커밋된 값이 무엇이든 실물이 이긴다.
#
# 빌드는 전부 여기서 한다. Vercel 은 서빙만 한다 — 그쪽 빌드 환경에는
# Flutter 가 없어서 데모 없는 사이트가 나가고, 우리 빌드의 마지막 단계인
# 개발 전용 경로 제거도 돌지 않는다. 그래서 프로젝트의 Git 연결은 끊어 두었다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild-all:
        description: '데모를 전부 다시 만든다 (캐시 무시)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      rebuild-all:
        type: boolean
        default: false

concurrency:
  # 배포는 한 번에 하나만. 늦게 끝난 쪽이 이기는 경쟁을 막는다.
  group: deploy
  cancel-in-progress: false

env:
  # 러너 기본값에 맡기지 않는다. 데모의 렌더러는 엔진 리비전이 들어간 공용
  # CDN 주소에서 오므로, 버전을 고정하면 데모들이 같은 주소를 공유해
  # 방문자 쪽 캐시 적중률도 함께 안정된다.
  FLUTTER_VERSION: '3.47.1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 패키지 저장소들이 이 저장소의 형제로 놓여야 한다. 스크립트가 경로를
      # 자기 위치에서 뽑기 때문에, 하위 디렉터리로 체크아웃해야 ../<slug> 가 선다.
      - name: 저장소 체크아웃
        uses: actions/checkout@v5
        with:
          path: kihyun-opensource

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: kihyun-opensource/web/pnpm-lock.yaml

      - name: 의존성 설치
        working-directory: kihyun-opensource/web
        run: pnpm install --frozen-lockfile

      # 커밋된 packages.ts 는 릴리스를 모른다. 먼저 pub.dev 에서 진짜 버전을
      # 받아와야 "무엇을 다시 만들 것인가" 를 판단할 수 있다. 이 시점의
      # demoReady 는 아직 믿을 수 없고, 데모를 앉힌 뒤 다시 생성해 바로잡는다.
      - name: 패키지 목록 생성 (버전 확정)
        working-directory: kihyun-opensource
        run: node scripts/gen-packages.mjs

      # 캐시 키는 **재생성된** 목록에서 뽑는다. 커밋된 파일로 키를 만들면
      # 릴리스가 있어도 키가 그대로라 캐시가 적중하고, 아무것도 다시 만들지
      # 않은 채 배포가 나간다.
      - name: 캐시 키 계산
        id: fingerprint
        working-directory: kihyun-opensource
        shell: bash
        run: echo "key=$(shasum -a 256 web/src/content/packages.ts | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # 키에 run_id 를 넣어 실행마다 새 항목을 쓴다. GitHub 캐시 키는 **불변**
      # 이라 같은 키로 덮어쓸 수 없다 — 한 번 잘못 저장된 항목(예: 데모가 하나도
      # 없는 판)이 그 키에 눌러앉으면 이후 모든 배포가 그것을 복원하고, exact
      # hit 이라 저장도 건너뛰어 영원히 나아지지 않는다. 실제로 그렇게 됐다.
      # 복원은 접두사로 받으므로 늘 가장 최근 성공본이 온다.
      - name: 데모 캐시 복원
        id: demo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            kihyun-opensource/web/public/demo
            kihyun-opensource/web/.demo-versions.json
          key: demos-${{ steps.fingerprint.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            demos-${{ steps.fingerprint.outputs.key }}-
            demos-

      # 형제 저장소를 태그로 받고, 낡은 데모만 다시 만든다. 캐시가 적중해도
      # 클론은 한다 — hasExample 이 그 실물로 정해지기 때문이다.
      - name: 데모 빌드
        working-directory: kihyun-opensource
        run: node scripts/ci-build-demos.mjs ${{ (inputs.rebuild-all && '--all') || '' }}

      # 성공한 판만 저장한다. 실패한 판을 넣으면 다음 배포가 그 반쪽짜리
      # 디렉터리를 신선한 것으로 받는다. 키가 실행마다 다르므로 cache-hit 을
      # 조건으로 쓰지 않는다 — 그 조건이 위의 오염을 고착시킨 원인이었다.
      - name: 데모 캐시 저장
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            kihyun-opensource/web/public/demo
            kihyun-opensource/web/.demo-versions.json
          key: demos-${{ steps.fingerprint.outputs.key }}-${{ github.run_id }}

      # 두 번째 생성. 이제서야 demoReady 가 러너의 실물을 말한다.
      # 커밋된 값이 무엇이든 여기서 덮인다.
      - name: 패키지 목록 재생성 (demoReady 확정)
        working-directory: kihyun-opensource
        run: node scripts/gen-packages.mjs

      - name: 검사
        working-directory: kihyun-opensource/web
        run: |
          # LayoutProps · PageProps 는 Next 이 생성하는 전역 타입이라
          # .next/types 가 없으면 tsc 가 찾지 못한다. 개발 기계에는 이전
          # 빌드가 남겨 둔 것이 있어 통과하지만 깨끗한 러너에는 없다.
          # typegen 은 전체 빌드 없이 그 타입만 만든다.
          pnpm exec next typegen
          pnpm exec tsc --noEmit
          pnpm exec eslint src
          pnpm test

      - name: 정적 빌드
        working-directory: kihyun-opensource/web
        run: pnpm build

      # 사이트는 100% 정적이므로 Vercel 의 프레임워크 감지에 기대지 않고
      # Build Output API 디렉터리를 직접 만든다. 그러면 Vercel 프로젝트의
      # 빌드 설정이 무엇이든 이 결과가 그대로 서빙된다.
      - name: 배포물 조립
        working-directory: kihyun-opensource/web
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output
          cp -r out .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json
          echo "static 파일 $(find .vercel/output/static -type f | wc -l)개 · $(du -sh .vercel/output/static | cut -f1)"
          test ! -e .vercel/output/static/design || {
            echo "::error::개발 전용 /design 이 배포물에 남아 있다"; exit 1; }

      - name: Vercel 배포
        working-directory: kihyun-opensource/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          npx --yes vercel@latest deploy --prebuilt --prod --archive=tgz \
            | tee -a "$GITHUB_STEP_SUMMARY"
